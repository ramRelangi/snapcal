name: snapcal
description: AI Food Calorie Counter for Indian Meals

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.0
  flutter_tts: ^4.0.0
  connectivity_plus: ^6.1.0
  fl_chart: ^0.70.0
  shared_preferences: ^2.3.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/
